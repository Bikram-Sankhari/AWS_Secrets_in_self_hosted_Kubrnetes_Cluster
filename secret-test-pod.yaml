apiVersion: v1
kind: Pod
metadata:
  name: secret-test-pod
  namespace: default
spec:
  serviceAccountName: secrets-reader-sa
  containers:
  - name: app
    image: amazon/aws-cli
    command: ["sleep", "3600"]
    volumeMounts:
    - name: secrets-store
      mountPath: "/mnt/secrets"
      readOnly: true
  volumes:
  - name: secrets-store
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "my-secret-provider"