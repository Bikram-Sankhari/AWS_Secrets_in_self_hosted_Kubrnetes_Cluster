apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-discovery
data:
  openid-configuration: |
    {
      "issuer": "https://oidc.sankhari.shop",
      "jwks_uri": "https://oidc.sankhari.shop/openid/v1/jwks",
      "response_types_supported": ["id_token"],
      "subject_types_supported": ["public"],
      "id_token_signing_alg_values_supported": ["RS256"]
    }