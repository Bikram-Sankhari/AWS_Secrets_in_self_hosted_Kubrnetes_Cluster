apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-nginx
  template:
    metadata:
      labels:
        app: oidc-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest

        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf

        - name: discovery
          mountPath: /usr/share/nginx/html/openid-configuration
          subPath: openid-configuration

        - name: jwks
          mountPath: /usr/share/nginx/html/jwks.json
          subPath: jwks.json

      volumes:
      - name: nginx-config
        configMap:
          name: oidc-nginx-config

      - name: discovery
        configMap:
          name: oidc-discovery

      - name: jwks
        configMap:
          name: oidc-jwks